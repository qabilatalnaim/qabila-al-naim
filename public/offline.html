<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1628" />
  <title>غير متصل بالإنترنت | قبيلة النعيم أهل الصفرا ٥١٥</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #162544 50%, #0a1628 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 480px;
      background: rgba(212, 175, 55, 0.05);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 0 60px rgba(212, 175, 55, 0.15);
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    h1 {
      color: #D4AF37;
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 12px;
    }
    p {
      color: #d1d5db;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(212, 175, 55, 0.2);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 9999px;
      color: #D4AF37;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #D4AF37, #F5D76E);
      color: #0a1628;
      font-weight: 700;
      font-size: 16px;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
    }
    .retry-btn:focus { outline: 3px solid #fff; outline-offset: 2px; }
    .footer {
      margin-top: 24px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <div class="icon" aria-hidden="true">📡</div>
    <span class="badge">قبيلة النعيم أهل الصفرا ٥١٥</span>
    <h1>غير متصل بالإنترنت</h1>
    <p>
      يبدو أنك غير متصل بالإنترنت حالياً. لا تقلق، يمكنك قراءة المحتوى الذي زرته سابقاً أو المحاولة مرة أخرى عند عودة الاتصال.
    </p>
    <a href="/" class="retry-btn" aria-label="إعادة المحاولة - العودة للصفحة الرئيسية">
      🔄 إعادة المحاولة
    </a>
    <p class="footer">تراث عربي أصيل من حمص · منذ 2024</p>
  </main>
</body>
</html>
