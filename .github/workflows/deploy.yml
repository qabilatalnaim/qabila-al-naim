name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:cf

      - name: Clean dist/images (keep only WebP)
        run: |
          cd dist/images 2>/dev/null && rm -f *.jpg *.png && cd ../..
          echo "Dist size: $(du -sh dist/)"

      # Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: qabila-al-naim
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_VERSION: '20'

      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Successfully deployed to Cloudflare Pages"
          echo "🌐 Production: https://qabila-al-naim.pages.dev"
          echo "🔍 Preview (for PRs): Check the PR comments"
