name: Deploy to Surge.sh (Backup)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: 'surge-deploy'
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Surge.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🏗️ Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚀 Deploy to Surge.sh
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Install Surge
        run: npm install -g surge

      - name: 🌐 Deploy to Surge (Production)
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          # Deploy built dist folder to surge
          surge --project ./dist --domain qabilat-al-naim.surge.sh
        continue-on-error: true
